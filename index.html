<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئیلیڤلەتی گەنجان - Elevate Youth</title>
    <!-- هێنانی فۆنتی Noto Kufi Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Kufi Arabic', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            border: 1px solid #2e2e2e;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2ecc71; /* ڕەنگی سەوز */
            font-size: 24px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header h1 span.english {
            font-size: 18px;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #2ecc71;
        }

        /* ستایلی تاگی a کە وەک دوگمە دەردەکەوێت */
        .btn-link {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 12px;
        }

        .btn-link:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>
                <span>ئێلیڤەیتی گەنجان  </span>
                <span class="english">(Elevate Youth)</span>
            </h1>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="name">ناوی سیانی:</label>
                <input type="text" id="name" name="name" placeholder="ناوی تەواوت بنووسە" required>
            </div>

            <div class="form-group">
                <label for="phone">ژمارەی تەلەفۆن:</label>
                <input type="tel" id="phone" name="phone" placeholder="07XXXXXXXXX" required>
            </div>

            <div class="form-group">
                <label for="city">شار:</label>
                <input type="text" id="city" name="city" placeholder="ناوی شارەکەت بنووسە" required>
            </div>

            <div class="form-group">
                <label for="edu">خوێندنگە:</label>
                <input type="text" id="edu" name="edu" placeholder="ناوی خوێندنگەکەت بنووسە" required>
            </div>

            <!-- دوگمەی یەکەم: سەیڤ کردن -->
            <a href="" id="submitBtn" class="btn-link">سەیڤ کردن</a>
            
            <!-- دوگمەی دووەم: چوونە ناو لاپەڕەی داهاتوو -->
            <a href="ganajan1.html">
    <button>چوونە ناو لاپەڕەی داهاتوو</button>
</a>
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw25P9CdV_Uqdf8wu7jrL-vZ6XqaHo6dxc4EpquCIT3TH3QXY7sk0xy6B_NCGbVo8n06w/exec';
        
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('loginForm');

        submitBtn.addEventListener('click', e => {
            e.preventDefault(); 
            
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const city = document.getElementById('city').value;
            const edu = document.getElementById('edu').value;

            if(!name || !phone || !city || !edu) {
                alert('تکایە هەموو خانەکان پڕبکەرەوە!');
                return;
            }

            submitBtn.style.pointerEvents = 'none';
            submitBtn.textContent = 'تکایە چاوەڕوان بە...';

            // ناردنی داتاکان بە شێوازی no-cors بۆ ئەوەی ڕێگری CORS نەبێتە هۆی وەستاندن
            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors',
                body: new FormData(form)
            }).finally(() => {
                // کاتێک ناردنەکە ئەنجام درا (یاخود ڕەوانە کرا)، ڕاستەوخۆ دەچێتە لاپەڕەی داهاتوو
               window.location.href = "ganjan1.html";  
            });
        });
    </script>

</body>
</html>
